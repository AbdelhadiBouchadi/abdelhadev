# The pull-request gates (docs/quality.md): static checks, unit tests, the build, the secret scan and a
# small e2e smoke (foundation, no-JavaScript, a11y) at 1440. The timing-sensitive browser specs and
# Lighthouse run in e2e-full.yml, on main, weekly and on demand, and never block a pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:tokens
      - run: pnpm check:i18n
      - run: pnpm test
      - name: wordmark-paths.ts is fresh
        run: pnpm brand:paths && git diff --exit-code src/components/brand/wordmark-paths.ts
      - run: pnpm build
      # Browsers are cached per Playwright version; the system libraries are installed either way.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: e2e smoke (1440)
        run: >-
          pnpm exec playwright test
          tests/e2e/foundation.spec.ts tests/e2e/no-js.spec.ts tests/e2e/a11y.spec.ts
          --project=1440
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 14
